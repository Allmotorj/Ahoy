name: Preempt Morgan security alert

on:
  push:
    branches:
      - security/morgan-1.12.0-2026-09

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh Morgan only
        run: |
          npm pkg set dependencies.morgan='~1.12.0'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Verify Morgan
        shell: node {0}
        run: |
          const lock = require('./package-lock.json');
          const v = lock.packages?.['node_modules/morgan']?.version;
          if (!v || !/^1\.12\./.test(v)) throw new Error(`Unexpected morgan version: ${v}`);
          console.log(`morgan=${v}`);
      - name: Commit refreshed manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: bump morgan to 1.12.0" || exit 0
          git push
