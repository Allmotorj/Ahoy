name: Refresh Mongoose lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/mongoose-6.13.10

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Regenerate lockfile for patched Mongoose
        run: npm install mongoose@6.13.10 --save --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh mongoose lockfile"
          git push
